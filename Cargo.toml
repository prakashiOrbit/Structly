[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/db-core",
    "crates/db-postgres",
    "crates/db-mysql",
    "crates/db-sqlite",
    "crates/ssh-tunnel",
    "crates/secrets",
    "crates/app-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "chrono",
    "json",
] }

db-core = { path = "crates/db-core" }
db-postgres = { path = "crates/db-postgres" }
db-mysql = { path = "crates/db-mysql" }
db-sqlite = { path = "crates/db-sqlite" }
ssh-tunnel = { path = "crates/ssh-tunnel" }
secrets = { path = "crates/secrets" }
app-storage = { path = "crates/app-storage" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
