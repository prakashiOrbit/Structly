[package]
name = "structly"
version.workspace = true
description = "Structly — a cross-engine desktop database client"
authors = ["Prakash"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "structly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }

db-core.workspace = true
db-postgres.workspace = true
db-mysql.workspace = true
db-sqlite.workspace = true
ssh-tunnel.workspace = true
secrets.workspace = true
app-storage.workspace = true
